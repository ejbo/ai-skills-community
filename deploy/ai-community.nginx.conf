# ───────────────────────────────────────────────────────────────────────────
#  AI Community (skills-community Next.js app) — mounted under /ai-community
#  on the cari.rnd.huawei.com server block (migrated from ai4news.rnd.huawei.com
#  2026-07). Adds a subpath alongside any neighbour apps in that server { }.
#
#  ⚠️ THIS FILE NOW HAS TWO PARTS. They go in DIFFERENT nginx contexts:
#     PART A  →  the `http { }` block (usually /etc/nginx/nginx.conf), because
#                `upstream` and `map` are only legal there.
#     PART B  →  inside the cari `server { }`, ABOVE its catch-all `location /`.
#     Pasting PART A inside `server { }` fails with
#     `"upstream" directive is not allowed here`.
#
#  Then:  sudo nginx -t   and reload — on THIS box nginx is NOT systemd-managed:
#         sudo ps -o pid,ppid,args -C nginx   →   sudo kill -HUP <master-pid>
#         (`systemctl reload nginx` and `nginx -s reload` both fail here, and
#          `systemctl restart nginx` takes ai4news + cari_dste down with it.)
#
#  DOMAIN SEPARATION (owner decision 2026-08): the two hostnames are SEPARATE
#  SITES. news keeps ai4news.rnd.huawei.com untouched; ai-community lives ONLY
#  on cari.rnd.huawei.com. These /ai-community locations must therefore exist
#  ONLY under the cari server_name — never paste them into the news block, and
#  delete them from it if they ever end up there (`sudo nginx -T` to audit).
#  The `if ($host != "cari...")` guards inside each block ENFORCE the split even
#  when one server { } answers both names — which is exactly how the 2026-08
#  login incident happened: a W3 login started on the news hostname wrote its
#  host-scoped state cookie into that jar while AUTH_URL pinned the callback to
#  cari ("InvalidCheck: state value could not be parsed"). The 301 (not 404)
#  keeps old /ai-community links circulating inside news working: they bounce
#  to cari and the user just signs in there. No news-side change is needed.
#
#  CRITICAL: NO trailing slash on proxy_pass. The /ai-community/ prefix MUST reach
#  Next.js intact — it is the app's basePath (NEXT_BASE_PATH=/ai-community). This is
#  the opposite of /cari_dste/, which uses a trailing slash to STRIP its prefix.
#
#  PATHS: every `alias` below is
#      <WorkingDirectory>/<LOCAL_STORAGE_DIR>/<subdir>/
#  i.e. systemd's WorkingDirectory (deploy/ai-community.service —
#  /home/eason/projects/ai-skills-community) joined with the app's
#  LOCAL_STORAGE_DIR from `.env` (default `./storage`) — the storage libs resolve
#  their roots exactly that way, so CHANGING LOCAL_STORAGE_DIR WITHOUT CHANGING
#  THESE ALIASES serves empty bodies for every image and video. The one exception
#  is `.next/static`, which is <WorkingDirectory>/.next/static and unrelated to
#  LOCAL_STORAGE_DIR. If you deploy elsewhere, they ALL need updating.
#  Trailing slashes on `alias` are load-bearing — keep them.
# ───────────────────────────────────────────────────────────────────────────


# ═══════════════════════════════════════════════════════════════════════════
#  PART A — paste into `http { }`  (NOT inside server { })
# ═══════════════════════════════════════════════════════════════════════════

# Keepalive to the app. Without this, nginx opens a BRAND NEW TCP connection to
# 127.0.0.1:3100 for every single request — every RSC navigation, every JSON
# poll, every image — and leaves it in TIME_WAIT. A cold page load is ~35
# requests, so this is ~35 connect/close cycles per visitor per page.
upstream ai_community {
    server 127.0.0.1:3100;
    keepalive          64;      # idle upstream connections held open per worker
    keepalive_timeout  60s;
    keepalive_requests 1000;
}

# Keepalive only works if we DON'T send `Connection: upgrade` on ordinary
# requests. This map sends `upgrade` for real websocket upgrades and an EMPTY
# value otherwise — an empty Connection header is dropped, which is what lets
# proxy_http_version 1.1 + the upstream keepalive pool above take effect.
# (The old config hardcoded `Connection "upgrade"` on 100% of requests, which
# silently disabled keepalive for 100% of them.)
map $http_upgrade $connection_upgrade_aic {
    default upgrade;
    ''      '';
}

# ⚠️ OPTIONAL — AND DANGEROUS ON THIS NETWORK. LEFT COMMENTED OUT ON PURPOSE.
# These key on $binary_remote_addr, i.e. the TCP peer. On a corporate intranet a
# large fraction of users can arrive NATed behind a handful of egress addresses,
# so "per client" silently becomes "per building" and a rate limit here would
# throttle everyone at once. The app-level rate limiting (lib/rate-limit.ts,
# keyed on the USER id when logged in) is the correct layer and is already in
# place for /api/search, shorts publish and the login path.
# Enable these ONLY after confirming with `awk '{print $1}' access.log | sort |
# uniq -c | sort -rn | head` that client addresses really are distinct, and then
# uncomment the matching `limit_req`/`limit_conn` lines in PART B too.
# limit_req_zone  $binary_remote_addr zone=aic_search:10m rate=10r/s;
# limit_req_zone  $binary_remote_addr zone=aic_auth:10m   rate=2r/s;
# limit_conn_zone $binary_remote_addr zone=aic_conn:10m;


# ═══════════════════════════════════════════════════════════════════════════
#  PART B — paste into the cari `server { }`, ABOVE its catch-all `location /`
#           Order does not matter to nginx (longest `^~` prefix wins), but keep
#           them together for readability.
# ═══════════════════════════════════════════════════════════════════════════

# ── 1. Static build assets — served by nginx, never by Node ─────────────────
# `_next/static/*` is content-hashed and immutable. Previously these were
# proxied through the single Node process, which ALSO renders every page and
# (until X-Accel was enabled) pumped every video byte. Measured on a real
# production build of this repo: with 32 clients pulling one 489 KB chunk, HTML
# document throughput fell 128 → 61 req/s. Serving them here takes that load off
# the event loop entirely.
# `gzip_static on` serves a pre-built `.gz` sibling with ZERO CPU — generate them
# at deploy time (see docs/capacity-tuning.md §2.8); without the .gz files nginx
# just serves the plain file, so this is safe either way.
# This is a LONGER `^~` prefix than `/ai-community/` below, so it wins.
location ^~ /ai-community/_next/static/ {
    # Same host canonicalization as the app block below — CLAUDE.md pitfall #10(a)
    # says the 301 covers BOTH /ai-community locations, and this is now one of
    # them. Assets served from the alias host would be fetched with that host's
    # cookie jar; keep every /ai-community URL on the canonical name.
    if ($host != "cari.rnd.huawei.com") {
        return 301 https://cari.rnd.huawei.com$request_uri;
    }

    alias /home/eason/projects/ai-skills-community/.next/static/;
    sendfile      on;
    tcp_nopush    on;
    # `aio threads` needs nginx built --with-threads, and `gzip_static` needs
    # ngx_http_gzip_static_module. Neither is in every build. If `nginx -t` says
    # "unknown directive", just DELETE that one line — both are pure speedups and
    # everything works without them. Check with: nginx -V 2>&1 | tr ' ' '\n' | grep -E 'threads|gzip_static'
    aio           threads;
    gzip_static   on;
    open_file_cache          max=4000 inactive=120s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;
    access_log off;
    add_header Cache-Control 'public, max-age=31536000, immutable' always;
}

# ── 2. The app ──────────────────────────────────────────────────────────────
# `^~` = if this prefix is the longest match, DON'T fall through to any regex
# `location ~* \.(js|css|png|…)$` block the server may already have — those
# would otherwise hijack /ai-community/_next/static/*.js and break the app's assets.
location ^~ /ai-community/ {
    # Host canonicalization — this server block ALSO answers on its pre-2026-07
    # name (ai4news.rnd.huawei.com), which news users still enter through. Auth
    # cookies are HOST-scoped while AUTH_URL pins the OAuth callback to cari, so
    # a W3 login STARTED on the old name writes its state cookie into the wrong
    # cookie jar and the callback dies with
    #   [auth][error] InvalidCheck: state value could not be parsed
    # Force every /ai-community request onto the canonical host first.
    # (`if` + `return` inside location is one of the two safe `if` uses.)
    if ($host != "cari.rnd.huawei.com") {
        return 301 https://cari.rnd.huawei.com$request_uri;
    }

    proxy_pass         http://ai_community;                # upstream from PART A — NO trailing slash
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;            # app trusts this for absolute/callback URLs

    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade_aic;   # '' for normal requests ⇒ keepalive works

    proxy_read_timeout 300s;                               # long SSE / LLM streaming responses
    proxy_send_timeout 300s;                               # slow clients pushing large video uploads
    client_max_body_size 5g;                               # match the app's video cap (was 64m → 413 on large uploads)
    proxy_request_buffering off;                           # stream big uploads to the app, don't buffer the whole file to a temp dir first

    # RESPONSE buffering is ON (nginx default) so nginx absorbs a response from
    # Node at LAN speed and then dribbles it out to a slow client on its own
    # time. With it OFF — as this block used to be — the Node socket and its
    # JS-level write pump stay pinned for as long as the SLOWEST reader takes,
    # on the one thread that also renders every page.
    # The 4 SSE routes that genuinely need unbuffered streaming
    # (library/video/skill chat + comparison workshop) each send
    # `X-Accel-Buffering: no`, which turns buffering off for THOSE responses
    # only — the correct way to have both.
    proxy_buffering        on;
    proxy_buffer_size      128k;   # ≥ the SSE citation first-frame (a 4k default truncated it)
    proxy_buffers          16 64k; # 1 MB — the 281 KB HTML document fits comfortably
    proxy_busy_buffers_size 256k;
    proxy_max_temp_file_size 0;    # never spool to disk: that disk also serves video + postgres WAL

    # Don't double-compress: Next already gzips its own responses.
    gzip off;

    # Pairs with PART A's limit_conn_zone — commented out for the same
    # NAT reason. See the warning there before enabling.
    # limit_conn aic_conn 40;
}

# ── 3. Burst-protected endpoints — DISABLED BY DEFAULT ──────────────────────
# Uncomment ONLY together with PART A's limit_req_zone lines, and only after
# reading the NAT warning there. Everything below is inert as written.
#
# Longer `^~` prefixes than /ai-community/, so these win for their paths. Each
# repeats the proxy settings because location blocks don't inherit from siblings.
# location ^~ /ai-community/api/search {
#     if ($host != "cari.rnd.huawei.com") { return 301 https://cari.rnd.huawei.com$request_uri; }
#     limit_req zone=aic_search burst=20 nodelay;
#     proxy_pass         http://ai_community;
#     proxy_http_version 1.1;
#     proxy_set_header   Host              $host;
#     proxy_set_header   X-Real-IP         $remote_addr;
#     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#     proxy_set_header   X-Forwarded-Proto https;
#     proxy_set_header   Connection        $connection_upgrade_aic;
# }

# location ^~ /ai-community/api/auth/callback/credentials {
#     if ($host != "cari.rnd.huawei.com") { return 301 https://cari.rnd.huawei.com$request_uri; }
#     limit_req zone=aic_auth burst=5 nodelay;
#     proxy_pass         http://ai_community;
#     proxy_http_version 1.1;
#     proxy_set_header   Host              $host;
#     proxy_set_header   X-Real-IP         $remote_addr;
#     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#     proxy_set_header   X-Forwarded-Proto https;
#     proxy_set_header   Connection        $connection_upgrade_aic;
# }

# ── 4. Internal byte-servers (kernel sendfile), paired with X-Accel-Redirect ─
# The app does auth() + a stat, then returns `X-Accel-Redirect: /_xxx/<key>` with
# no body; nginx serves the file straight off disk. Node leaves the byte path
# entirely, so concurrent viewers/seeks scale on nginx instead of the single JS
# thread. `internal` = not reachable from the browser.
#
# Gated by TWO env flags, because each root needs its own location here:
#   VIDEO_X_ACCEL_REDIRECT=true  → enables /_video/
#   MEDIA_X_ACCEL_REDIRECT=true  → enables /_zonemedia/ /_votemedia/ /_postmedia/ /_uploads/
# Paste ALL FIVE, then flip BOTH flags. Flipping a flag whose location is missing
# serves EMPTY BODIES (nginx has nowhere to redirect to) — that is the one way to
# get this wrong.
#
# The nginx worker user must be able to READ files written by User=eason
# (same group + 0644 files, and o+x on the dirs) — the usual gotcha. Verify with:
#   sudo -u <nginx-user> cat /home/eason/projects/ai-skills-community/storage/videos/<some file> > /dev/null
#
# `^~` on every one of these is REQUIRED, for the same reason §1 and §2 have it.
# An X-Accel-Redirect is an internal redirect: nginx re-runs location matching on
# the new URI, and a PLAIN prefix location loses to any matching regex location.
# These roots serve exactly the extensions a shared server block's
# `location ~* \.(js|css|png|jpg|gif|mp4|…)$` rule would claim — so without `^~`,
# `/_video/poster/abc.jpg` would be served from THAT block's root the moment the
# env flags are flipped: every avatar, sticker, poster and video 404s at once,
# while the app logs a perfectly correct 200. (`internal` is checked far later in
# the request phases and does not influence which location is chosen.)
#
# HEADERS — the part that is easy to get wrong. On an X-Accel handoff nginx does
# NOT forward arbitrary upstream headers: it copies only the ones flagged
# `redirect` in its own ngx_http_upstream_headers_in[] table. Content-Type,
# Cache-Control and Content-Disposition ARE in it, so the app's values ride
# through and these blocks deliberately do not re-add them (a second
# Cache-Control would be sent ALONGSIDE the app's, not instead of it).
# `X-Content-Type-Options` is NOT in that table, so the app's `nosniff` is
# silently dropped — and for `/_uploads/`, which is the anonymous public root,
# nosniff plus the image-only content type are its only two defenses against
# HTML/JS being served from an upload. Hence the explicit add_header below.
# Note also that `add_header` at this level CANCELS any inherited from the
# server/http level, so if that block sets security headers, list them here too.
# Accept-Ranges is deliberately NOT set: nginx's static file handler emits it.

location ^~ /_video/ {
    internal;
    alias /home/eason/projects/ai-skills-community/storage/videos/;
    sendfile   on;
    tcp_nopush on;
    aio        threads;
    open_file_cache          max=2000 inactive=60s;   # reuse fds/stat for hot files under load
    open_file_cache_valid    60s;
    open_file_cache_min_uses  1;
    open_file_cache_errors   on;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /_zonemedia/ {
    internal;
    alias /home/eason/projects/ai-skills-community/storage/zone-media/;
    sendfile on; tcp_nopush on; aio threads;
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /_votemedia/ {
    internal;
    alias /home/eason/projects/ai-skills-community/storage/vote-media/;
    sendfile on; tcp_nopush on; aio threads;
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /_postmedia/ {
    internal;
    alias /home/eason/projects/ai-skills-community/storage/post-media/;
    sendfile on; tcp_nopush on; aio threads;
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
    add_header X-Content-Type-Options nosniff always;
}

# Editor images, avatars and 表情包. Highest REQUEST count of all the media roots
# (a busy feed page pulls dozens), even though each file is small.
location ^~ /_uploads/ {
    internal;
    alias /home/eason/projects/ai-skills-community/storage/uploads/;
    sendfile on; tcp_nopush on; aio threads;
    open_file_cache max=8000 inactive=300s;
    open_file_cache_valid 300s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
}

# ── 5. Bare /ai-community ───────────────────────────────────────────────────
# → PROXY to the app (do NOT 301 it to /ai-community/).
# Next serves the basePath root WITHOUT a trailing slash and 308-redirects
# /ai-community/ → /ai-community; a `return 301 /ai-community/` here fights that and
# causes an infinite redirect loop ("redirected you too many times"). Proxying the bare
# path lets Next own canonicalization: /ai-community/ → (one 308) → /ai-community → 200.
location = /ai-community {
    # Same host canonicalization as the main block above.
    if ($host != "cari.rnd.huawei.com") {
        return 301 https://cari.rnd.huawei.com$request_uri;
    }

    proxy_pass         http://ai_community;   # NO trailing slash
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Connection        $connection_upgrade_aic;
}
