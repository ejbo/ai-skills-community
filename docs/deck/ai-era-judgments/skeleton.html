<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>再次遇到大时代 — AI 时代的十个判断</title>
<style>
:root{
  --red:#C7000B; --red-br:#E60012; --red-dk:#8C0008; --red-tint:#FBEDED;
  --blue:#0A4A7A; --blue-dk:#1A2942; --violet:#6A3D8F; --amber:#B26A00; --green:#2E6B33;
  --ink:#1F1F1F; --body:#2A2A2A; --sub:#666; --line:#D2D2D2; --zebra:#F6F8FB;
  /* 洞察图 (insight figure) 调色板 —— 灰是结构色，红是结论色，蓝是对照色 */
  --g1:#595959; --g2:#7F7F7F; --g3:#A6A6A6; --g4:#D9D9D9; --g5:#F2F2F2;
  --navy:#1F3864; --cblue:#2F5597; --cblue-lt:#9DC3E6; --cblue-pale:#DEEBF7;
  --cred:#C00000; --peach:#FBE5D6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#8A8A8A;color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.deck{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0}
.slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;
  display:flex;flex-direction:column;padding:22px 36px 0;box-shadow:0 3px 16px rgba(0,0,0,.3)}

/* ── 页眉 / 标题 / 页脚（华为 CARI 框架） ── */
.hdr{flex:none;height:22px;display:flex;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px}
.tab{font-size:12px;line-height:21px;padding:0 12px;background:#EDEDED;color:#555;border:1px solid #DCDCDC}
.tab.on{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.corner{font-size:11.5px;color:var(--sub);letter-spacing:.4px}
.corner b{color:var(--red)}
.h1{flex:none;margin-top:12px;font-size:30px;line-height:1.18;font-weight:700;color:var(--red)}
.sub{flex:none;margin-top:6px;font-size:14.5px;color:var(--sub);line-height:1.4}
.sub b{color:var(--cred)}
.rule{flex:none;height:3px;background:var(--red);margin-top:8px}
.body{flex:1 1 auto;min-height:0;display:flex;gap:14px;padding:12px 0 8px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.bar{flex:none;background:var(--red);color:#fff;padding:10px 16px 11px;margin:0 -36px;
  font-size:15px;line-height:1.45;font-weight:600}
.bar em{font-style:normal;background:rgba(255,255,255,.24);padding:0 4px}
.ft{flex:none;height:32px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--sub)}
.ft img{height:19px;display:block}

/* ── 旧版模块（保留，少用） ── */
.mod{border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mod>h3{flex:none;font-size:15px;font-weight:700;color:#fff;background:var(--red);padding:7px 12px}
.mod>.in{flex:1 1 auto;min-height:0;padding:11px 12px;overflow:hidden}
ul.b{list-style:none}
ul.b>li{position:relative;padding-left:15px;font-size:14.5px;line-height:1.5;margin-bottom:7px;color:var(--body)}
ul.b>li:before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;background:var(--red)}
ul.b>li:last-child{margin-bottom:0}
b{font-weight:700} .r{color:var(--red);font-weight:700} .rd{color:var(--red-dk);font-weight:700}

/* ── 洞察图（insight figure）版式 ── */
.panes{flex:1;min-height:0;display:flex;gap:16px;width:100%}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane-t{flex:none;font-size:14.5px;font-weight:700;color:#000;line-height:1.3;margin-bottom:5px}
.pane-t.c{text-align:center}
.k{color:var(--cred);font-weight:700}
.fig{position:relative;flex:1;min-height:0}
.fig>svg{display:block;width:100%;height:100%}
.fig svg text,svg text{font-family:"Microsoft YaHei","PingFang SC","Segoe UI","Helvetica Neue",Arial,sans-serif}
.src{position:absolute;right:6px;bottom:2px;font-size:10px;color:#8A8A8A;font-style:italic}
.band{background:var(--g5);padding:8px 12px;font-size:14px;line-height:1.45;color:var(--body)}
.band b,.quote b{color:#000}
.quote{background:var(--peach);padding:8px 12px;font-size:14px;line-height:1.45;color:var(--body)}
.box{border:1px solid #000;border-radius:4px;padding:6px 9px;font-size:13px;line-height:1.4;background:#fff;color:var(--body)}
.box.dash{border-style:dashed;border-color:var(--g2)}
.box.grey{border-color:var(--g3);background:#FAFAFA}
.box .t{font-weight:700;color:#000;display:block;margin-bottom:2px}
.concl{flex:none;text-align:center;font-size:15px;font-weight:700;color:var(--cred);line-height:1.35;padding-top:4px}
ul.dot{list-style:none}
ul.dot>li{position:relative;padding-left:13px;font-size:13.5px;line-height:1.45;margin-bottom:4px;color:var(--body)}
ul.dot>li:before{content:"•";position:absolute;left:0;top:0;color:#000}
ul.dot>li:last-child{margin-bottom:0}

/* 灰表头小字表格（排行表） */
table{width:100%;border-collapse:collapse;font-size:14px}
table.fill{height:100%}
th{background:var(--blue);color:#fff;font-weight:700;text-align:left;padding:7px 10px;border:1px solid #fff;font-size:13.5px}
td{border:1px solid var(--line);padding:7px 10px;vertical-align:middle;line-height:1.4}
tbody tr:nth-child(odd){background:var(--zebra)}
table.g th{background:var(--g4);color:#000;font-size:12px;padding:3px 6px;border:1px solid #fff;font-weight:700}
table.g td{font-size:12px;padding:2px 6px;border:1px solid var(--g4);line-height:1.3;vertical-align:middle}
table.g tbody tr:nth-child(odd){background:#fff}
table.g tbody tr:nth-child(even){background:#FAFAFA}
table.g tr.hl td{background:var(--cblue-pale)}
table.g td.num{text-align:right;font-variant-numeric:tabular-nums}

/* ── 封面 / 收尾 ── */
.cover{padding:0;display:block}
.cover .ct{position:absolute;left:64px;top:150px;width:720px}
.cover .kicker{font-size:15px;color:var(--sub);letter-spacing:2px;margin-bottom:14px}
.cover .ty{font-size:52px;font-weight:700;color:var(--red);line-height:1.15;letter-spacing:-.5px}
.cover .st{margin-top:18px;font-size:22px;color:#000;line-height:1.4}
.cover .meta{margin-top:40px;font-size:13.5px;color:var(--sub);line-height:1.7}
.cover .lg{position:absolute;right:56px;bottom:44px}
.cover .lg img{height:44px;display:block}
.cover .art{position:absolute;right:0;top:0;width:520px;height:720px;overflow:hidden}
.cover .art svg{display:block}
.end{padding:0;display:block}
.end .ct{height:100%;padding:120px 60px 36px}
.end .ty{font-size:62px;font-weight:700;letter-spacing:-1px}
.end .ms{margin-top:26px;font-size:17px;line-height:1.7;max-width:820px}
.end .ms .en{display:block;color:var(--sub);font-size:14px;margin-top:7px}
.end .cp{position:absolute;left:60px;right:60px;bottom:24px;font-size:8.5px;color:#8A8A8A;line-height:1.55}
.end .lg{position:absolute;right:56px;bottom:64px}
.end .lg img{height:44px;display:block}

@page{size:1280px 720px;margin:0}
@media print{
  html,body{background:#fff}.deck{gap:0;padding:0}
  .slide{page-break-after:always;box-shadow:none}.slide:last-child{page-break-after:auto}
}
</style>
<!-- deck-editor:css:begin --><!-- deck-editor:css:end -->
</head>
<body>
<div class="deck" id="deck">
<!-- SLIDES -->
</div>

</body>
</html>
